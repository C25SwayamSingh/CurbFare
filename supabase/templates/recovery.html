<div
  style="
    background-color: #efe7d8;
    padding: 32px 16px;
    font-family:
      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
      Helvetica, Arial, sans-serif;
  "
>
  <div
    style="
      max-width: 440px;
      margin: 0 auto;
      background-color: #faf5ec;
      border-radius: 16px;
      padding: 36px 32px;
    "
  >
    <p
      style="
        margin: 0 0 28px;
        font-size: 18px;
        font-weight: 700;
        color: #275c62;
      "
    >
      Curbfare
    </p>
    <h1
      style="
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
        color: #29211a;
      "
    >
      Reset your password
    </h1>
    <p
      style="
        margin: 0 0 28px;
        font-size: 15px;
        line-height: 1.6;
        color: #5c463b;
      "
    >
      We received a request to reset the password for
      <strong style="color: #29211a">{{ .Email }}</strong>.
    </p>
    <a
      href="{{ .SiteURL }}/auth/recovery?token_hash={{ .TokenHash }}&amp;type=recovery"
      style="
        display: inline-block;
        background-color: #f67e04;
        color: #241505;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        padding: 13px 28px;
        border-radius: 10px;
      "
      >Reset password</a
    >
    <p
      style="
        margin: 28px 0 0;
        font-size: 13px;
        line-height: 1.6;
        color: #8a7a6d;
      "
    >
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
  <p
    style="
      max-width: 440px;
      margin: 16px auto 0;
      font-size: 12px;
      color: #8a7a6d;
      text-align: center;
    "
  >
    Curbfare · Street food, found. ·
    <a href="https://curbfare.app" style="color: #275c62">curbfare.app</a>
  </p>
</div>
