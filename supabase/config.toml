project_id = "food-vendor-platform"

[db]
port = 54322
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/recovery",
  "http://localhost:3000/auth/verify",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Default is 1m — slows repeated local reset-email testing in Mailpit.
max_frequency = "1s"

[auth.rate_limit]
# Default is 2/hour; too low for local auth flow testing.
email_sent = 1000

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

# TOTP multi-factor authentication (Phase 2 foundation)
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ---------------------------------------------------------------------------
# Production overrides, applied by `supabase config push` for the linked
# project. Local values above stay untouched for `supabase start`.
# ---------------------------------------------------------------------------
[remotes.production]
project_id = "qklfsvrcltrbdnmsdpwn"

[remotes.production.auth]
site_url = "https://curbfare.app"
additional_redirect_urls = [
  "https://curbfare.app/auth/callback",
  "https://curbfare.app/auth/confirm",
  "https://curbfare.app/auth/recovery",
  "https://curbfare.app/auth/verify",
]

[remotes.production.auth.email]
# Real users, real pacing: one resend per minute instead of the local 1s.
max_frequency = "1m"

[remotes.production.auth.rate_limit]
# The local 1000/hour is a testing convenience; production stays modest
# until Resend SMTP is wired in (see docs/DEPLOYMENT.md).
email_sent = 30
